<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视频生成台</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/web/favicon.svg">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login hidden">
  <div class="login-box">
    <h2>视频生成台</h2>
    <input type="password" id="pwd" placeholder="访问密码" autocomplete="current-password">
    <button class="btn primary" id="loginBtn">进入</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- 主体 -->
<div id="app" class="hidden">

  <header class="topbar">
    <div class="brand">视频生成台</div>
    <div class="top-actions">
      <div class="health" id="health" title="点击刷新自检">检测中…</div>
      <button class="btn ghost small" id="logoutBtn" type="button">退出</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="new">新建</button>
    <button class="tab" data-tab="running">进行中<span class="badge hidden" id="runBadge">0</span></button>
    <button class="tab" data-tab="history">历史</button>
  </nav>

  <!-- 新建 -->
  <section class="page active" id="page-new">
    <div class="seg" id="modeSeg">
      <button class="seg-item active" data-mode="t2v">文字生成</button>
      <button class="seg-item" data-mode="i2v">图片生成</button>
      <button class="seg-item" data-mode="flf">首尾帧</button>
      <button class="seg-item" data-mode="r2v">万能参考</button>
      <button class="seg-item" data-mode="t2i">文生图</button>
    </div>

    <div class="imgrow hidden" id="imgRow">
      <label class="imgpick" id="pickFirst">
        <input type="file" accept="image/*" id="fileFirst" hidden>
        <div class="imgpick-inner">
          <img class="hidden" id="prevFirst" alt="">
          <span id="labelFirst">+ 首帧图片</span>
        </div>
        <button type="button" class="imgclear" data-slot="first" hidden aria-label="清除首帧">×</button>
      </label>
      <label class="imgpick hidden" id="pickLast">
        <input type="file" accept="image/*" id="fileLast" hidden>
        <div class="imgpick-inner">
          <img class="hidden" id="prevLast" alt="">
          <span id="labelLast">+ 尾帧图片</span>
        </div>
        <button type="button" class="imgclear" data-slot="last" hidden aria-label="清除尾帧">×</button>
      </label>
    </div>
    <div class="galrow hidden" id="imgGalRow">
      <button type="button" class="btn ghost small" id="pickGalleryFirst">从图库选首帧</button>
      <button type="button" class="btn ghost small hidden" id="pickGalleryLast">从图库选尾帧</button>
    </div>
    <p class="hint hidden" id="imgHint">画面比例会自动跟随图片，不用再选比例</p>

    <div class="imgrow hidden" id="refRow">
      <label class="imgpick" id="pickRef0">
        <input type="file" accept="image/*" id="fileRef0" hidden>
        <div class="imgpick-inner">
          <img class="hidden" id="prevRef0" alt="">
          <span id="labelRef0">+ 参考图 1</span>
        </div>
        <button type="button" class="imgclear" data-slot="ref_0" hidden aria-label="清除参考图1">×</button>
      </label>
      <label class="imgpick" id="pickRef1">
        <input type="file" accept="image/*" id="fileRef1" hidden>
        <div class="imgpick-inner">
          <img class="hidden" id="prevRef1" alt="">
          <span id="labelRef1">+ 参考图 2</span>
        </div>
        <button type="button" class="imgclear" data-slot="ref_1" hidden aria-label="清除参考图2">×</button>
      </label>
      <label class="imgpick" id="pickRef2">
        <input type="file" accept="image/*" id="fileRef2" hidden>
        <div class="imgpick-inner">
          <img class="hidden" id="prevRef2" alt="">
          <span id="labelRef2">+ 参考图 3（可选）</span>
        </div>
        <button type="button" class="imgclear" data-slot="ref_2" hidden aria-label="清除参考图3">×</button>
      </label>
    </div>
    <p class="hint hidden" id="refHint">参考图保持主体一致，最多 3 张、至少 1 张（建议同款人物 / 物体）</p>
    <div class="galrow hidden" id="refGalRow">
      <button type="button" class="btn ghost small" id="pickGalleryRefs">从图库选参考图（可多选，最多 3 张）</button>
    </div>

    <div class="field projfield">
      <label>项目专库<span class="sub">留空＝默认库；填英文名（如 tianbao_nimingshu）按项目隔离素材与成品</span></label>
      <input type="text" id="projectInput" placeholder="如 tianbao_nimingshu" autocomplete="off" spellcheck="false">
    </div>

    <textarea id="prompt" placeholder="描述画面、镜头、以及声音（对白／音效／配乐）……&#10;&#10;例：黄昏的海边，女孩逆光奔跑，长发飞起，海浪声与轻柔钢琴曲"></textarea>
    <div class="promptbar">
      <span id="charCount">0 字</span>
      <button class="link" id="clearPrompt">清空</button>
    </div>

    <details class="params" id="paramBox">
      <summary>生成参数<span class="summary-note" id="paramSummary"></span></summary>

      <div class="field" id="wfField">
        <label>流程</label>
        <div class="chips" id="wfChips"></div>
      </div>

      <div class="field" id="stepsField">
        <label>步数<span class="sub">越大越精细，越慢</span></label>
        <div class="chips" id="stepChips"></div>
      </div>

      <div class="field" id="durField">
        <label>时长<span class="sub">秒</span></label>
        <div class="chips" id="durChips"></div>
      </div>

      <div class="field" id="resField">
        <label>生成分辨率<span class="sub">越高越慢，之后还会超分到 1080P</span></label>
        <div class="chips" id="resChips"></div>
      </div>

      <div class="field" id="ratioField">
        <label>画面比例</label>
        <div class="chips" id="ratioChips"></div>
      </div>

      <div class="field row" id="upscaleField">
        <label for="upscale">超分到 1080P</label>
        <label class="switch"><input type="checkbox" id="upscale" checked><span></span></label>
      </div>

      <div class="field">
        <label>随机种子<span class="sub">留空＝每次都不一样</span></label>
        <input type="number" id="seed" placeholder="留空即随机" inputmode="numeric">
      </div>
    </details>

    <button class="btn primary big" id="submitBtn">开始生成</button>
    <p class="msg" id="submitMsg"></p>
  </section>

  <!-- 进行中 -->
  <section class="page" id="page-running">
    <div id="runList"></div>
    <p class="empty" id="runEmpty">当前没有任务在跑</p>
  </section>

  <!-- 历史 -->
  <section class="page" id="page-history">
    <div class="searchbar">
      <input type="search" id="kw" placeholder="搜提示词…">
      <a class="btn ghost small" href="/api/export.csv">导出</a>
    </div>
    <div class="stats" id="stats"></div>
    <div id="hisList"></div>
    <button class="btn ghost" id="moreBtn">加载更多</button>
    <p class="empty hidden" id="hisEmpty">还没有记录</p>
  </section>

</div>

<div class="toast hidden" id="toast"></div>

<!-- 图库选择弹窗 -->
<div id="galleryModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="galleryTitle">从图库选择</span>
      <span id="galleryCount" class="sub"></span>
      <button type="button" class="x" id="galleryClose">×</button>
    </div>
    <div class="gal-grid" id="galleryGrid"></div>
    <div class="modal-foot">
      <button type="button" class="btn ghost small" id="galleryCancel">取消</button>
      <button type="button" class="btn primary small" id="galleryOk">选好了</button>
    </div>
  </div>
</div>

<script src="/web/app.js"></script>
</body>
</html>
