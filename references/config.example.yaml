# ============================================================
# ComfyUI 手机控制台 配置样例
# 复制为 config.yaml，按本机实际情况填写
# ============================================================

# ------------------------------------------------------------
# 1. Web 服务（手机浏览器访问的地址）
# ------------------------------------------------------------
server:
  # 0.0.0.0 = 允许局域网内手机访问；只想本机用就改 127.0.0.1
  host: "0.0.0.0"
  port: 8790

  # 访问密码。留空 = 不校验（仅建议家里局域网用）。
  # ★ 一旦开 ngrok / 外网穿透，务必填一个强密码。
  password: "改成你自己的强密码"

  # 会话有效期（天）。输过一次密码后多久不用再输
  session_days: 30

  # 单次 HTTP 请求（含所有上传文件）大小上限（MB）。
  # 自动化/CODEX 批量上传资产时可能一次带多个大图，建议 200。
  max_upload_mb: 200

# ------------------------------------------------------------
# 2. ComfyUI（本机地址，默认 8188）
# ------------------------------------------------------------
comfyui:
  host: "127.0.0.1"
  port: 8188
  # 模板里的 submit_to_comfyui() 会按你的工作流把任务投到这里。
  # 需要的字段（示例）：
  # workflow_default: "turbo"
  # workflows:
  #   turbo: { file: "workflows/t2v.json", ... }

# ------------------------------------------------------------
# 3. 运行时目录
# ------------------------------------------------------------
runtime:
  uploads_dir: "data/uploads"      # 资产库根（含项目专库）
  outputs_dir: "data/outputs"     # 成品输出（按项目分子目录）
  db_file: "data/tasks.db"        # 任务记录库
